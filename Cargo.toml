[workspace]
resolver = "2"
members = ["crates/vps-agent-core", "crates/vps-agent-priv", "crates/vps-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
